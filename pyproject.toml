[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "faxcli"
version = "0.1.0"
description = "Typed, tested fax CLI for the house PBX"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fax = "faxcli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["faxcli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "allow_subprocesses: permit subprocess.run calls (test installs its own fake)",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
