[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faxcli"
version = "0.1.0"
description = "Typed, tested fax CLI for the house PBX"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fax = "faxcli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["faxcli*", "faxconsole*"]

[tool.setuptools.package-data]
faxconsole = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "allow_subprocesses: permit subprocess.run calls (test installs its own fake)",
]
# A thread that dies of an exception, a network guard trip included, fails the run (the review of PR 8).
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
line-length = 110
extend-exclude = ["./legacy"]   # the frozen top-level baseline only; a bare "legacy" also hid nested dirs

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
